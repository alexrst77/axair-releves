<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#00174D">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AXAIR Relevés">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>AXAIR · Relevés de chantier</title>
<style>
:root{
  --navy:#00174D; --navy-2:#0B2A6B; --blue:#0271FD; --blue-soft:#E7F0FF; --red:#FA1419;
  --bg:#EEF2F8; --card:#FFFFFF; --line:#DCE3EE; --ink:#0D1B33; --muted:#64748B;
  --ok:#0E9F6E; --warn:#D97706; --r:14px; --safe:env(safe-area-inset-bottom,0px);
}
:root{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
h1,h2,h3{margin:0;letter-spacing:-.02em;font-weight:800;color:var(--navy)}
h1{font-size:1.5rem} h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:0 0 10px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
.hidden{display:none!important}

/* signature tricolore issue du logo */
.tri{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--navy) 0 46%,#fff 46% 60%,var(--red) 60% 100%);}
.tri-sm{height:3px;width:52px;border-radius:2px;background:linear-gradient(90deg,var(--navy) 0 46%,#E3E9F3 46% 60%,var(--red) 60% 100%);margin:6px 0 14px}

/* ---------- LOGIN ---------- */
#login{min-height:100%;display:none;flex-direction:column;justify-content:center;padding:28px 22px;
  background:radial-gradient(120% 70% at 50% 0%,#0B2A6B 0%,#00174D 58%,#000E2E 100%);}
#login .box{width:100%;max-width:400px;margin:0 auto}
#login img.logo{width:100%;max-width:280px;display:block;margin:0 auto 6px;filter:brightness(0) invert(1)}
#login .sub{color:#9FB6DC;text-align:center;margin:0 0 26px;font-size:.92rem}
#login .field{margin-bottom:12px}
#login label{display:block;font-size:.8rem;color:#9FB6DC;margin-bottom:6px;font-weight:600}
#login input{width:100%;padding:15px 14px;border-radius:12px;border:1px solid #1C3D7D;background:#071E52;color:#fff;font-size:16px}
#login input:focus{outline:2px solid var(--blue);border-color:transparent}
#login .hint{color:#7E97C4;font-size:.78rem;text-align:center;margin-top:18px;line-height:1.6}

/* ---------- BOUTONS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;
  padding:15px 18px;font-weight:700;font-size:1rem;background:var(--blue);color:#fff;cursor:pointer;min-height:50px}
.btn:active{transform:translateY(1px)}
.btn.block{width:100%}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.navy{background:var(--navy)}
.btn.danger{background:var(--red)}
.btn.sm{padding:9px 13px;min-height:40px;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.5}
.iconbtn{background:#fff;border:1px solid var(--line);border-radius:10px;width:42px;height:42px;display:inline-flex;
  align-items:center;justify-content:center;font-size:1.05rem;cursor:pointer}

/* ---------- APP SHELL ---------- */
#app{display:none;padding-bottom:calc(84px + var(--safe))}
header.top{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;padding:10px 16px 0;
  padding-top:calc(10px + env(safe-area-inset-top,0px))}
header.top .row{display:flex;align-items:center;gap:12px;padding-bottom:10px}
header.top img{height:26px;filter:brightness(0) invert(1)}
header.top .who{margin-left:auto;text-align:right;font-size:.72rem;color:#A8BEE2;line-height:1.25}
header.top .who b{display:block;color:#fff;font-size:.85rem;font-weight:700}
.screen{padding:16px 14px 8px;max-width:820px;margin:0 auto}
.screen-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:2px}
.screen-head .btn{margin-left:auto}
.hero{background:var(--navy);border-radius:var(--r);padding:16px;margin-bottom:14px}
.hero h1{color:#fff;margin-bottom:2px}
.hero p{color:#A8BEE2;font-size:.84rem;margin:0 0 10px}
.reftop{background:var(--navy);border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.reftop b{color:#fff;font-size:1rem;display:block}
.reftop .rt-main{flex:1;min-width:0;overflow:hidden}
.reftop .saveflag{color:#A8BEE2;font-size:.74rem}
.reftop .back{background:#12336E;color:#fff;border:0;border-radius:10px;width:40px;height:40px;font-size:1.15rem;flex:0 0 auto;cursor:pointer}
body.lock{position:fixed;left:0;right:0;overflow:hidden;width:100%}

/* ---------- CARTES ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.tap{cursor:pointer}
.card.tap:active{background:#F7FAFF}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:1.7rem;font-weight:800;color:var(--navy);letter-spacing:-.03em;line-height:1.1}
.stat span{font-size:.78rem;color:var(--muted);font-weight:600}
.stat.accent{background:var(--navy);border-color:var(--navy)}
.stat.accent b,.stat.accent span{color:#fff}
.stat.accent span{color:#A8BEE2}

.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0;padding-bottom:0}
.item:first-child{padding-top:0}
.item .main{flex:1;min-width:0}
.item .main b{display:block;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .main small{color:var(--muted);font-size:.8rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#E7EDF6;flex:0 0 auto}

.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:.7rem;font-weight:800;letter-spacing:.01em;white-space:nowrap}
.b-brouillon{background:#EDF1F7;color:#5A6781}
.b-completer{background:#FEF3C7;color:#92400E}
.b-termine{background:#D1FAE5;color:#065F46}
.b-valide{background:var(--blue-soft);color:#0B4FB8}
.b-archive{background:#E2E8F0;color:#475569}

/* ---------- FORMULAIRES ---------- */
.field{margin-bottom:12px}
.field label{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:5px}
.input,select.input,textarea.input{width:100%;padding:13px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:16px}
.input:focus{outline:2px solid var(--blue);border-color:transparent}
textarea.input{min-height:110px;resize:vertical;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:.85rem;font-weight:600;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.switch{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:.9rem}
.switch input{width:20px;height:20px;accent-color:var(--blue)}

/* ---------- ONGLETS RELEVÉ ---------- */
.tabs{position:sticky;top:calc(46px + env(safe-area-inset-top,0px));z-index:30;background:var(--bg);
  display:flex;gap:6px;overflow-x:auto;padding:10px 14px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:9px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);
  font-size:.85rem;font-weight:700;color:var(--muted);cursor:pointer}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ---------- PHOTOS ---------- */
.photogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.photo{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.photo img{width:100%;height:130px;object-fit:cover;display:block;background:#E7EDF6}
.photo .meta{padding:8px 9px}
.photo .meta .cap{font-size:.82rem;font-weight:700;color:var(--navy);min-height:1.2em}
.photo .meta .nt{font-size:.74rem;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.photo .acts{display:flex;gap:4px;padding:0 6px 7px}
.photo .acts button{flex:1;border:0;background:#F1F5FB;border-radius:8px;padding:7px 0;font-size:.9rem;cursor:pointer}
.capture{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.capture .btn{height:64px;font-size:1rem;flex-direction:column;gap:2px;line-height:1.1}
.capture .btn small{font-size:.68rem;font-weight:600;opacity:.8}
.prio-1{border-left:4px solid var(--red)} .prio-2{border-left:4px solid var(--warn)} .prio-3{border-left:4px solid var(--line)}

/* ---------- TRAVAUX ---------- */
.work{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.work .qty{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- NAV BASSE ---------- */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);
  display:flex;padding:6px 4px calc(6px + var(--safe));box-shadow:0 -6px 20px rgba(0,23,77,.07)}
nav.bottom button{flex:1;background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;
  gap:3px;color:var(--muted);font-size:.66rem;font-weight:700;cursor:pointer}
nav.bottom button .ic{font-size:1.3rem;line-height:1}
nav.bottom button.on{color:var(--blue)}
nav.bottom button.mid .ic{background:var(--blue);color:#fff;width:46px;height:46px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;margin-top:-20px;box-shadow:0 6px 16px rgba(2,113,253,.45);font-size:1.5rem}
nav.bottom button.mid{color:var(--blue)}

/* ---------- MODALES / VISIONNEUSE ---------- */
.sheet{position:fixed;inset:0;z-index:80;background:rgba(4,16,40,.55);display:flex;align-items:flex-end}
.sheet .inner{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + var(--safe))}
@media(min-width:700px){.sheet{align-items:center;justify-content:center}.sheet .inner{max-width:620px;border-radius:16px}}
.sheet .handle{width:40px;height:4px;background:var(--line);border-radius:99px;margin:0 auto 14px}
.sheetclose{float:right;margin:-6px 0 6px 10px;background:#F1F5FB;border:0;border-radius:10px;width:40px;height:40px;font-size:1rem;font-weight:700;color:var(--navy);cursor:pointer}
.viewer{position:fixed;inset:0;z-index:90;background:#040F28;display:flex;flex-direction:column}
.viewer .bar{display:flex;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;align-items:center;color:#fff;font-weight:700}
.viewer .bar button{margin-left:auto}
.viewer .stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
.viewer canvas,.viewer img{max-width:100%;max-height:100%;touch-action:none}
.tools{display:flex;gap:6px;overflow-x:auto;padding:10px 12px calc(12px + var(--safe));background:#071E52;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tools button{flex:0 0 auto;background:#12336E;color:#fff;border:0;border-radius:10px;padding:10px 13px;font-size:.85rem;font-weight:700;cursor:pointer}
.tools button.on{background:var(--blue)}
.tools .sep{width:1px;background:#1C3D7D;flex:0 0 auto;margin:4px 2px}

/* ---------- TOASTS / OFFLINE ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--safe));z-index:120;
  background:var(--navy);color:#fff;padding:11px 17px;border-radius:12px;font-size:.87rem;font-weight:600;
  box-shadow:0 8px 24px rgba(0,23,77,.3);opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
#toast.on{opacity:1}
#netbar{display:none;background:var(--warn);color:#fff;font-size:.78rem;font-weight:700;text-align:center;padding:6px 10px}
#netbar.sync{background:var(--ok)}
.saveflag{font-size:.72rem;color:var(--muted);font-weight:600}

/* ---------- RAPPORT ---------- */
#report{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px}
#report .rh{display:flex;align-items:flex-start;gap:14px;margin-bottom:10px}
#report .rh img{height:40px}
#report .rh .ref{margin-left:auto;text-align:right;font-size:.76rem;color:var(--muted)}
#report .rh .ref b{display:block;color:var(--navy);font-size:1rem}
#report h4{margin:18px 0 6px;font-size:.78rem;font-weight:800;color:var(--blue)}
#report table{width:100%;border-collapse:collapse;font-size:.82rem}
#report th{text-align:left;background:#F2F6FC;color:var(--navy);padding:7px 8px;font-size:.74rem}
#report td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
#report .kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:.85rem}
#report .kv div span{color:var(--muted);font-size:.74rem;display:block;font-weight:600}
#report .rphotos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#report .rphotos figure{margin:0}
#report .rphotos img{width:100%;border-radius:8px;border:1px solid var(--line)}
#report .rphotos figcaption{font-size:.75rem;margin-top:4px}
#report .rphotos figcaption b{color:var(--navy)}
#report .rphotos figcaption em{display:block;color:var(--muted);font-style:normal}
.empty{text-align:center;color:var(--muted);padding:26px 12px;font-size:.9rem}
.empty .big{font-size:2rem;display:block;margin-bottom:6px}
@media print{nav.bottom,header.top,.tabs,.noprint{display:none!important}#app{padding:0}#report{border:0}}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<div id="login">
  <div class="box">
    <img class="logo" id="loginLogo" alt="AXAIR Climatisation">
    <p class="sub">Relevés de chantier · Concevoir, installer, maintenir</p>
    <div class="field"><label for="li_mail">Pseudo</label>
      <input class="input" id="li_mail" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Pseudo"></div>
    <div class="field"><label for="li_pass">Mot de passe</label>
      <input class="input" id="li_pass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn block" id="li_go">Se connecter</button>

  </div>
</div>

<div id="app">
  <header class="top">
    <div class="row">
      <img id="topLogo" alt="AXAIR">
      <div class="who"><b id="whoName">—</b><span id="whoRole">—</span></div>
    </div>
    <div class="tri"></div>
  </header>
  <div id="netbar">Hors connexion — données enregistrées localement</div>
  <div id="tabsHost"></div>
  <main id="view"></main>
  <nav class="bottom">
    <button data-nav="home"><span class="ic">⌂</span>Accueil</button>
    <button data-nav="releves"><span class="ic">▤</span>Relevés</button>
    <button class="mid" data-nav="new"><span class="ic">＋</span>Nouveau</button>
    <button data-nav="clients"><span class="ic">☰</span>Clients</button>
    <button data-nav="profil"><span class="ic">◉</span>Profil</button>
  </nav>
</div>

<div id="toast"></div>
<div id="modals"></div>

function toast(msg,ms=2400){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),ms); }
async function sha(txt){
  if(window.crypto && crypto.subtle && location.protocol!=="file:"){
    const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("axair::"+txt));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
  }
  let h=0; const s="axair::"+txt; for(let i=0;i<s.length;i++){h=((h<<5)-h+s.charCodeAt(i))|0;} return "f"+(h>>>0).toString(16);
}

/* ---------- base de données locale (IndexedDB + repli mémoire) ---------- */
const DB = (()=>{
  const STORES=["users","clients","releves","logs","meta"];
  let db=null, mem={}, useMem=false;
  STORES.forEach(s=>mem[s]={});
  function open(){
    return new Promise(res=>{
      if(!window.indexedDB){ useMem=true; return res(); }
      let rq;
      try{ rq=indexedDB.open("axair_releves",1); }catch(e){ useMem=true; return res(); }
      rq.onupgradeneeded=e=>{ const d=e.target.result; STORES.forEach(s=>{ if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:"id"}); }); };
      rq.onsuccess=e=>{ db=e.target.result; res(); };
      rq.onerror=()=>{ useMem=true; res(); };
      setTimeout(()=>{ if(!db&&!useMem){useMem=true;res();} },2500);
    });
  }
  function tx(store,mode){ return db.transaction(store,mode).objectStore(store); }
  const put = (store,obj)=> new Promise(res=>{
    if(useMem){ mem[store][obj.id]=JSON.parse(JSON.stringify(obj)); return res(obj); }
    const r=tx(store,"readwrite").put(obj); r.onsuccess=()=>res(obj); r.onerror=()=>{ mem[store][obj.id]=obj; res(obj); };
  });
  const del = (store,id)=> new Promise(res=>{
    if(useMem){ delete mem[store][id]; return res(); }
    const r=tx(store,"readwrite").delete(id); r.onsuccess=()=>res(); r.onerror=()=>res();
  });
  const all = store => new Promise(res=>{
    if(useMem) return res(Object.values(mem[store]));
    const r=tx(store,"readonly").getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>res(Object.values(mem[store]));
  });
  const get = (store,id)=> new Promise(res=>{
    if(useMem) return res(mem[store][id]||null);
    const r=tx(store,"readonly").get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(mem[store][id]||null);
  });
  return {open, all, get, isMem:()=>useMem, putLocal:put, delLocal:del,
    put:(store,obj)=>{ Cloud.push(store,obj); return put(store,obj); },
    del:(store,id)=>{ Cloud.del(store,id); return del(store,id); }};
})();

/* ---------- synchronisation Firestore (optionnelle) ---------- */
const Cloud = (()=>{
  let fdb=null, on=false, busy=false, lastErr="";
  const sig = p => [p.src?p.src.length:0,p.legende,p.note,p.cat,p.emplacement,p.prio,p.obs].join("|");
  const net = o => JSON.parse(JSON.stringify(o));   // Firestore refuse les valeurs undefined
  function erreur(e){
    lastErr = (e && (e.code||e.message)) ? (e.code||e.message) : String(e);
    console.warn("Firestore",e);
  }
  async function init(){
    if(!FIREBASE_CONFIG.apiKey || !window.firebase) return false;
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      fdb=firebase.firestore();
      try{ await fdb.enablePersistence({synchronizeTabs:true}); }catch(e){}
      try{ await firebase.auth().signInAnonymously(); }catch(e){ erreur(e); }
      on=true;
    }catch(e){ console.warn("Firebase indisponible",e); on=false; }
    return on;
  }
  function push(store,obj){
    if(!on||!obj||!obj.id) return;
    (async()=>{
      try{
        if(store==="releves"){
          const photos=obj.photos||[];
          const copie=net(obj); delete copie.photos; delete copie._cloudPhotos;
          fdb.collection("releves").doc(obj.id).set(copie).catch(erreur);
          const sub=fdb.collection("releves").doc(obj.id).collection("photos");
          for(const ph of photos){
            const st=sig(ph);
            if(ph._sig===st) continue;
            ph._sig=st; const d=net(ph); delete d._sig;
            sub.doc(ph.id).set(d).catch(erreur);
          }
          const snap=await sub.get();
          const ids=photos.map(x=>x.id);
          snap.docs.forEach(d=>{ if(!ids.includes(d.id)) d.ref.delete().catch(()=>{}); });
        } else {
          fdb.collection(store).doc(obj.id).set(net(obj)).catch(erreur);
        }
      }catch(e){ erreur(e); }
    })();
  }
  function del(store,id){ if(on) fdb.collection(store).doc(id).delete().catch(()=>{}); }
  async function photosDe(id){
    if(!on) return [];
    const snap=await fdb.collection("releves").doc(id).collection("photos").get();
    return snap.docs.map(d=>{ const p=d.data(); p._sig=sig(p); return p; });
  }
  async function pull(){
    if(!on||busy) return false; busy=true;
    try{
      for(const store of ["users","clients","logs","meta"]){
        const snap=await fdb.collection(store).get();
        for(const d of snap.docs){
          const dist=d.data(), loc=await DB.get(store,d.id);
          if(store==="meta" && d.id==="compteur"){
            const n=Math.max(dist.n||0,(loc&&loc.n)||0);
            await DB.putLocal("meta",{id:"compteur",n}); continue;
          }
          const md=dist.maj||dist.ts||dist.cree||0, ml=loc?(loc.maj||loc.ts||loc.cree||0):-1;
          if(md>=ml) await DB.putLocal(store,dist);
        }
      }
      const snap=await fdb.collection("releves").get();
      for(const d of snap.docs){
        const dist=d.data(), loc=await DB.get("releves",d.id);
        if(loc && (loc.maj||0)>(dist.maj||0)) continue;
        dist.photos=(loc&&loc.photos)||[];
        dist._cloudPhotos=true;
        await DB.putLocal("releves",dist);
      }
      return true;
    }catch(e){ erreur(e); return false; }
    finally{ busy=false; }
  }
  return {init,push,del,pull,photosDe,actif:()=>on,erreur:()=>lastErr};
})();

function appliqueFiltres(){
  S.filters={q:$("#f_q").value.trim(),st:$("#f_st").value,ob:$("#f_ob").value,vi:$("#f_vi").value,
    us:$("#f_us").value,d1:$("#f_d1").value,d2:$("#f_d2").value};
  rendreResultats();
}
function filtrer(){
  const f=S.filters||{};
  return mesReleves().filter(r=>{
    if(f.st&&r.statut!==f.st) return false;
    if(f.ob&&r.objet!==f.ob) return false;
    if(f.vi&&r.ville!==f.vi) return false;
    if(f.us&&r.auteur!==f.us) return false;
    if(f.d1&&(r.date||"")<f.d1) return false;
    if(f.d2&&(r.date||"")>f.d2) return false;
    if(f.q){ const q=f.q.toLowerCase();
      const blob=[r.ref,r.clientNom,r.societe,r.adresse,r.ville,r.cp,r.objet,r.objetAutre,r.adressePost,r.villePost,r.auteur,r.notes,r.tel,r.email]
        .concat((r.travaux||[]).map(t=>t.designation)).join(" ").toLowerCase();
      if(!blob.includes(q)) return false; }
    return true;
  });
}
function rendreResultats(){
  const rs=filtrer(); const h=$("#resultats"); if(!h) return;
  h.innerHTML = rs.length
    ? `<div style="display:flex;align-items:center;margin-bottom:8px"><b style="color:var(--navy)">${rs.length} relevé${rs.length>1?"s":""}</b>
       ${can("exporter")?`<button class="btn sm ghost" style="margin-left:auto" onclick="exportCSV()">Export CSV</button>`:""}</div>`
      + rs.map(ligneReleve).join("")
    : `<div class="empty"><span class="big">⌕</span>Aucun relevé ne correspond.<br>Élargissez vos filtres.</div>`;
}
function exportCSV(){
  const rs=filtrer();
  const head=["Référence","Date","Client","Société","Adresse","CP","Ville","Objet","Utilisateur","Statut","Photos","Travaux"];
  const lines=[head.join(";")].concat(rs.map(r=>[r.ref,r.date,r.clientNom,r.societe,r.adresse,r.cp,r.ville,objetLabel(r),
    r.auteur,(STATUTS[r.statut]||{}).l,(r.photos||[]).length,(r.travaux||[]).length]
    .map(v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"').join(";")));
  const blob=new Blob(["\uFEFF"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="RELEVES_AXAIR_"+today().replace(/-/g,"")+".csv"; a.click();
  toast("Export CSV téléchargé");
}

async function changePass(){
  const a=$("#p1").value,b=$("#p2").value;
  if(a.length<6) return toast("6 caractères minimum");
  if(a!==b) return toast("Les deux mots de passe diffèrent");
  S.user.pass=await sha(a); await DB.put("users",S.user); await log("a changé son mot de passe");
  toast("Mot de passe modifié"); $("#p1").value=$("#p2").value="";
}
async function synchroniser(){
  toast("Synchronisation…");
  for(const r of S.releves) Cloud.push("releves",r);
  for(const c of S.clients) Cloud.push("clients",c);
  for(const u of S.users) Cloud.push("users",u);
  const ok=await Cloud.pull(); await refresh();
  if(ok) toast("Synchronisation terminée");
  else{
    const e=Cloud.erreur()||"";
    toast(e.includes("permission-denied") ? "Refusé par Firestore : publiez les règles de sécurité"
      : e.includes("unauthenticated")||e.includes("admin-restricted")||e.includes("operation-not-allowed")
        ? "Activez la connexion Anonyme dans Firebase Authentication"
      : e.includes("unauthorized-domain") ? "Ajoutez alexrst77.github.io aux domaines autorisés"
      : "Synchronisation impossible"+(e?" ("+e+")":""), 5200);
  }
  vProfil();
}

async function sauvegardeJSON(){
  const data={entreprise:S.entreprise,users:await DB.all("users"),clients:await DB.all("clients"),
    releves:await DB.all("releves"),logs:await DB.all("logs"),export:Date.now()};
  const b=new Blob([JSON.stringify(data)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b);
  a.download="SAUVEGARDE_AXAIR_"+today().replace(/-/g,"")+".json"; a.click();
  toast("Sauvegarde téléchargée");
}
async function restaureJSON(e){
  const f=e.target.files[0]; if(!f) return;
  if(!confirm("Restaurer cette sauvegarde ? Les données actuelles seront fusionnées.")) return;
  const d=JSON.parse(await f.text());
  for(const k of ["users","clients","releves","logs"]) for(const o of (d[k]||[])) await DB.put(k,o);
  if(d.entreprise){ d.entreprise.id="entreprise"; await DB.put("meta",d.entreprise); S.entreprise=d.entreprise; }
  await refresh(); toast("Sauvegarde restaurée"); go("home");
}

  const dup=S.users.find(x=>(norm(x.email)===norm(mail)||norm(x.nom)===norm(nom))&&x.id!==id);
  if(dup) return toast("Ce pseudo ou cette adresse existe déjà");
  const old=S.users.find(x=>x.id===id);
  const pw=$("#u_pass").value.trim();
  if(!exist&&!pw) return toast("Définissez un mot de passe");
  const u={id,nom,email:mail,role:$("#u_role").value,

    actif:$("#u_actif").checked, cree:old?old.cree:Date.now(), dernier:old?old.dernier:null, maj:Date.now(),
    pass: pw? await sha(pw) : (old?old.pass:"")};

  await refresh(); closeSheet(); toast("Utilisateur enregistré"); go("users");

}

/* ---------- compression image ---------- */
function compress(file,max=1600,q=0.72,keepPng=false){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image();
      img.onload=()=>{ let{width:w,height:h}=img; const s=Math.min(1,max/Math.max(w,h));
        const cv=document.createElement("canvas"); cv.width=Math.round(w*s); cv.height=Math.round(h*s);
        const cx=cv.getContext("2d"); cx.drawImage(img,0,0,cv.width,cv.height);
        res(cv.toDataURL(keepPng?"image/png":"image/jpeg",q)); };
      img.onerror=()=>res(fr.result); img.src=fr.result; };
    fr.readAsDataURL(file);
  });
}

async function addPhotos(ev){
  const files=[...ev.target.files]; if(!files.length) return;
  toast("Traitement des photos…");
  for(const f of files){
    const src=await compress(f);
    S.current.photos.push({id:uid(),src,orig:src,legende:"",note:"",cat:"",emplacement:"",prio:3,obs:"",shapes:[]});
  }
  ev.target.value=""; touchSave(); vEditeur();
  toast(files.length+" photo"+(files.length>1?"s ajoutées":" ajoutée"));
}
function movePhoto(i,d){
  const p=S.current.photos, j=i+d; if(j<0||j>=p.length) return;
  [p[i],p[j]]=[p[j],p[i]]; touchSave(); tPhotos();
}
function delPhoto(i){
  if(!confirm("Supprimer cette photo ?")) return;
  S.current.photos.splice(i,1); touchSave(); vEditeur();
}

/* ===================== MOTEUR D'ANNOTATION / CROQUIS ===================== */
const D={cv:null,cx:null,base:null,shapes:[],redo:[],tool:"fleche",color:"#FA1419",size:5,cur:null,onSave:null,grid:false};
function openCanvas(opt){
  D.shapes=JSON.parse(JSON.stringify(opt.shapes||[])); D.redo=[]; D.tool=opt.grid?"libre":"fleche";
  D.color="#FA1419"; D.onSave=opt.onSave; D.grid=!!opt.grid; D.base=null;
  const tools=[["fleche","➚ Flèche"],["cercle","○ Cercle"],["ligne","／ Ligne"],["rect","▭ Rectangle"],
    ["texte","T Texte"],["libre","✎ Libre"]].concat(opt.grid?[["mesure","↔ Mesure"]]:[]);
  lockScroll();
  $("#modals").innerHTML=`<div class="viewer">
    <div class="bar">${esc(opt.title)}<button class="iconbtn" onclick="closeSheet()">✕</button></div>
    <div class="stage"><canvas id="dcv"></canvas></div>
    <div class="tools">
      ${tools.map(([k,l])=>`<button data-t="${k}" class="${D.tool===k?"on":""}" onclick="setTool('${k}')">${l}</button>`).join("")}
      <span class="sep"></span>
      ${["#FA1419","#0271FD","#FACC15","#00174D","#FFFFFF"].map(c=>`<button data-c="${c}" onclick="setColor('${c}')"
        style="background:${c};width:38px;border:2px solid ${c===D.color?"#fff":"transparent"}">&nbsp;</button>`).join("")}
      <span class="sep"></span>
      <button onclick="undo()">↺ Annuler</button><button onclick="redo()">↻ Refaire</button>
      <button onclick="clearAll()">✕ Effacer</button>
      <span class="sep"></span>
      <button style="background:#0E9F6E" onclick="saveCanvas()">✓ Valider</button>
    </div></div>`;
  D.cv=$("#dcv"); D.cx=D.cv.getContext("2d");
  const start=()=>{ fitCanvas(); paint(); attachDraw(); };
  if(opt.baseSrc){ const img=new Image(); img.onload=()=>{ D.base=img; D.cv.width=img.width; D.cv.height=img.height; start(); }; img.src=opt.baseSrc; }
  else { D.cv.width=1200; D.cv.height=850; start(); }
}
function fitCanvas(){
  const stage=$(".stage"), r=stage.getBoundingClientRect();
  const s=Math.min(r.width/D.cv.width, r.height/D.cv.height);
  D.cv.style.width=(D.cv.width*s)+"px"; D.cv.style.height=(D.cv.height*s)+"px";
}
function setTool(t){ D.tool=t; $$(".tools button[data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t===t)); }
function setColor(c){ D.color=c; $$(".tools button[data-c]").forEach(b=>b.style.border="2px solid "+(b.dataset.c===c?"#fff":"transparent")); }
function undo(){ if(D.shapes.length){ D.redo.push(D.shapes.pop()); paint(); } }
function redo(){ if(D.redo.length){ D.shapes.push(D.redo.pop()); paint(); } }
function clearAll(){ if(D.shapes.length&&confirm("Effacer toutes les annotations ?")){ D.shapes=[]; D.redo=[]; paint(); } }
function pos(e){
  const r=D.cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)*D.cv.width/r.width, y:(e.clientY-r.top)*D.cv.height/r.height};
}
function attachDraw(){
  const cv=D.cv;
  const stop=e=>e.preventDefault();
  cv.addEventListener("touchstart",stop,{passive:false});
  cv.addEventListener("touchmove",stop,{passive:false});
  $(".stage").addEventListener("touchmove",stop,{passive:false});
  cv.addEventListener("pointerdown",e=>{
    e.preventDefault(); cv.setPointerCapture(e.pointerId); const p=pos(e);
    if(D.tool==="texte"){
      const t=prompt("Texte à ajouter :"); if(t) { D.shapes.push({t:"texte",x:p.x,y:p.y,txt:t,c:D.color}); paint(); }
      return;
    }
    D.cur={t:D.tool,x:p.x,y:p.y,x2:p.x,y2:p.y,c:D.color,pts:[[p.x,p.y]]};
  });
  cv.addEventListener("pointermove",e=>{
    if(!D.cur) return; e.preventDefault(); const p=pos(e); D.cur.x2=p.x; D.cur.y2=p.y;
    if(D.cur.t==="libre") D.cur.pts.push([p.x,p.y]);
    paint(D.cur);
  });
  const end=()=>{ if(D.cur){ D.shapes.push(D.cur); D.cur=null; D.redo=[]; paint(); } };
  cv.addEventListener("pointerup",end); cv.addEventListener("pointercancel",end);
  window.addEventListener("resize",fitCanvas);
}
function paint(extra){
  const cx=D.cx,cv=D.cv;
  cx.clearRect(0,0,cv.width,cv.height);
  if(D.base) cx.drawImage(D.base,0,0,cv.width,cv.height);
  else{
    cx.fillStyle="#fff"; cx.fillRect(0,0,cv.width,cv.height);
    cx.strokeStyle="#E2E8F0"; cx.lineWidth=1;
    for(let x=0;x<cv.width;x+=40){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,cv.height);cx.stroke();}
    for(let y=0;y<cv.height;y+=40){cx.beginPath();cx.moveTo(0,y);cx.lineTo(cv.width,y);cx.stroke();}
  }
  const lw=Math.max(3,Math.round(cv.width/300));
  [...D.shapes, ...(extra?[extra]:[])].forEach(s=>{
    cx.strokeStyle=s.c; cx.fillStyle=s.c; cx.lineWidth=lw; cx.lineCap="round"; cx.lineJoin="round";
    const dx=s.x2-s.x, dy=s.y2-s.y;
    if(s.t==="ligne"||s.t==="fleche"||s.t==="mesure"){
      cx.beginPath(); cx.moveTo(s.x,s.y); cx.lineTo(s.x2,s.y2); cx.stroke();
      if(s.t==="fleche"){
        const a=Math.atan2(dy,dx), h=lw*5;
        cx.beginPath(); cx.moveTo(s.x2,s.y2);
        cx.lineTo(s.x2-h*Math.cos(a-.4),s.y2-h*Math.sin(a-.4));
        cx.lineTo(s.x2-h*Math.cos(a+.4),s.y2-h*Math.sin(a+.4));
        cx.closePath(); cx.fill();
      }
      if(s.t==="mesure"){
        const len=Math.round(Math.hypot(dx,dy)/40*10)/10;
        cx.font="bold "+(lw*6)+"px sans-serif"; cx.textAlign="center";
        const txt=(s.txt!=null?s.txt:len+" m");
        const mx=(s.x+s.x2)/2, my=(s.y+s.y2)/2-lw*3;
        cx.fillStyle="#fff"; const w=cx.measureText(txt).width+12;
        cx.fillRect(mx-w/2,my-lw*6,w,lw*8); cx.fillStyle=s.c; cx.fillText(txt,mx,my);
      }
    } else if(s.t==="rect"){ cx.strokeRect(s.x,s.y,dx,dy); }
    else if(s.t==="cercle"){ cx.beginPath(); cx.ellipse(s.x+dx/2,s.y+dy/2,Math.abs(dx/2),Math.abs(dy/2),0,0,7); cx.stroke(); }
    else if(s.t==="libre"){ cx.beginPath(); (s.pts||[]).forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1])); cx.stroke(); }
    else if(s.t==="texte"){
      cx.font="bold "+(lw*7)+"px sans-serif"; cx.textAlign="left";
      const w=cx.measureText(s.txt).width+14;
      cx.fillStyle="rgba(255,255,255,.88)"; cx.fillRect(s.x-7,s.y-lw*7,w,lw*9);
      cx.fillStyle=s.c; cx.fillText(s.txt,s.x,s.y);
    }
  });
}
function saveCanvas(){
  const data=D.cv.toDataURL("image/jpeg",0.82);
  D.onSave(data,D.shapes); closeSheet();
}
function annoter(i){
  const p=S.current.photos[i];
  openCanvas({title:"Annoter la photo "+(i+1), baseSrc:p.orig||p.src, shapes:p.shapes,
    onSave:(data,shapes)=>{ p.src=data; p.shapes=shapes; touchSave(); vEditeur(); toast("Annotations enregistrées"); }});
}

      : `<div class="empty"><span class="big">▤</span>Aucun travail listé.<br>Détaillez les prestations relevées sur site.</div>`}`;
}

function moveTr(i,d){ const t=S.current.travaux,j=i+d; if(j<0||j>=t.length) return; [t[i],t[j]]=[t[j],t[i]]; touchSave(); tTravaux(); }

let reco=null;
function tNotes(){
  const r=S.current;
  const dispo = "webkitSpeechRecognition" in window || "SpeechRecognition" in window;
  $("#tabBody").innerHTML=`<div class="card"><h2>Notes techniques du chantier</h2><div class="tri-sm"></div>
    <p style="color:var(--muted);font-size:.85rem">Travaux à réaliser, accès, matériel, contraintes, sécurité, évacuation.</p>
    <textarea class="input" id="n_txt" style="min-height:240px"
      placeholder="ex. Local technique au sous-sol, accès par escalier étroit. Prévoir carotteuse Ø 70 pour traversée de mur.
Alimentation électrique à reprendre depuis le tableau divisionnaire.
Évacuation des condensats vers descente EP existante.">${esc(r.notes)}</textarea>
    <div class="grid2" style="margin-top:10px">
      ${dispo?`<button class="btn" id="micBtn" onclick="toggleDictee()">🎙 Dicter</button>`
        :`<button class="btn ghost" disabled>Dictée indisponible sur ce navigateur</button>`}
      <button class="btn ghost" onclick="insereModele()">Insérer un modèle</button>
    </div></div>`;
  bind("n_txt","notes");
}
function insereModele(){
  const t=$("#n_txt");
  const modele=`ACCÈS CHANTIER : 
MATÉRIEL NÉCESSAIRE : 
CONTRAINTES / SÉCURITÉ : 
ÉVACUATION DES DÉCHETS : 
TRAVAUX À RÉALISER : `;
  t.value=(t.value?t.value+"\n\n":"")+modele; S.current.notes=t.value; touchSave(); t.focus();
}
function stopDictee(){
  const btn=$("#micBtn");
  if(reco){ reco._stop=true; try{reco.stop();}catch(e){} reco=null; }
  if(btn){ btn.textContent="🎙 Dicter"; btn.classList.remove("danger"); }
}
function toggleDictee(){
  const btn=$("#micBtn"), t=$("#n_txt");
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(reco) return stopDictee();
  if(!SR) return toast("Utilisez le micro du clavier de votre téléphone");
  try{ reco=new SR(); }catch(e){ return toast("Dictée indisponible ici — micro du clavier"); }
  reco.lang="fr-FR"; reco.continuous=false; reco.interimResults=false; reco.maxAlternatives=1;
  reco.onresult=e=>{
    let add="";
    for(let i=e.resultIndex;i<e.results.length;i++) if(e.results[i].isFinal) add+=e.results[i][0].transcript+" ";
    add=add.trim();
    if(add){ t.value=(t.value?t.value.trimEnd()+" ":"")+add; S.current.notes=t.value; touchSave(); }
  };
  reco.onerror=e=>{
    const msg={"not-allowed":"micro refusé — Réglages > Safari > Microphone",
      "service-not-allowed":"micro bloqué dans l'app installée, utilisez le micro du clavier",
      "no-speech":"rien entendu","audio-capture":"aucun micro détecté","network":"réseau indisponible"}[e.error]||e.error;
    toast("Dictée : "+msg); stopDictee();
  };
  reco.onend=()=>{ if(reco&&!reco._stop){ try{ reco.start(); }catch(e){ stopDictee(); } } };
  try{ reco.start(); }catch(e){ return toast("Relancez la dictée"); }
  btn.textContent="⏹ Arrêter la dictée"; btn.classList.add("danger");
  toast("Parlez, le texte s'ajoute aux notes");
}

/* ---------- génération PDF ---------- */
function loadJsPDF(){
  return new Promise((res,rej)=>{
    if(window.jspdf) return res(window.jspdf.jsPDF);
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload=()=>res(window.jspdf.jsPDF); s.onerror=rej; document.head.appendChild(s);
  });
}
async function buildPDF(r){
  const jsPDF=await loadJsPDF(); const e=S.entreprise;
  const doc=new jsPDF({unit:"mm",format:"a4"});
  const W=210,H=297,M=14; let y=M;
  const navy=[0,23,77], blue=[2,113,253], red=[250,20,25], grey=[100,116,139];
  const srcs=[e.logo||LOGO].concat((r.photos||[]).map(p=>p.src)).concat(r.croquis?[r.croquis]:[]);
  const dims={};
  await Promise.all(srcs.map(src=>new Promise(ok=>{
    const i=new Image();
    i.onload=()=>{ dims[src]={w:i.naturalWidth||4,h:i.naturalHeight||3}; ok(); };
    i.onerror=()=>{ dims[src]={w:4,h:3}; ok(); };
    i.src=src;
  })));
  const imgSize=src=>dims[src]||{w:4,h:3};
  function trico(yy){ doc.setFillColor(...navy); doc.rect(M,yy,(W-2*M)*.46,1.2,"F");
    doc.setFillColor(...red); doc.rect(M+(W-2*M)*.6,yy,(W-2*M)*.4,1.2,"F"); }
  function br(need){ if(y+need>H-20){ doc.addPage(); y=M; } }
  function h4(t){ br(14); y+=4; doc.setFontSize(8.5); doc.setTextColor(...blue); doc.setFont("helvetica","bold");
    doc.text(t.toUpperCase(),M,y); y+=1.5; doc.setDrawColor(225,232,240); doc.line(M,y,W-M,y); y+=5; }
  // en-tête
  try{ const d=imgSize(e.logo||LOGO); const lw=42, lh=lw*d.h/d.w; doc.addImage(e.logo||LOGO,"PNG",M,y,lw,lh); }catch(err){}
  doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(...navy);
  doc.text(r.ref||"",W-M,y+6,{align:"right"});
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...grey);
  doc.text("Relevé de chantier",W-M,y+11,{align:"right"});
  doc.text(fdate(r.date)+(r.heure?" · "+r.heure:""),W-M,y+15.5,{align:"right"});
  y+=20; trico(y); y+=6;
  // blocs infos
  function bloc(titre,pairs0){
    const pairs=pairs0.filter(p=>p[0]);
    h4(titre);
    doc.setFontSize(9);
    pairs.forEach((p,i)=>{
      const col = i%2, x = M + col*(W-2*M)/2;
      if(col===0) br(11);
      doc.setTextColor(...grey); doc.setFont("helvetica","normal"); doc.setFontSize(7.5);
      doc.text(p[0],x,y);
      doc.setTextColor(30,41,59); doc.setFont("helvetica","bold"); doc.setFontSize(9.5);
      const vls=doc.splitTextToSize(String(p[1]||"—"),(W-2*M)/2-6).slice(0,2);
      vls.forEach((l,k)=>doc.text(l,x,y+4.5+k*4.3));
      if(col===1||i===pairs.length-1) y+=11;
    });
  }
  bloc("Client",[["Société",r.societe],["Contact",r.clientNom],["Téléphone",r.tel],["Email",r.email]]
    .concat((r.adressePost||r.villePost)?[["Adresse postale",[r.adressePost,r.cpPost,r.villePost].filter(Boolean).join(" ")]]:[]));
  bloc("Chantier",[["Adresse",r.adresse],["Commune",[r.cp,r.ville].filter(Boolean).join(" ")],
    ["Objet du chantier",objetLabel(r)],["Relevé effectué par",r.auteur]]);
  if(r.notes){
    h4("Notes techniques");
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(30,41,59);
    doc.splitTextToSize(r.notes,W-2*M).forEach(l=>{ br(6); doc.text(l,M,y); y+=4.8; });
    y+=2;
  }
  if((r.travaux||[]).length){
    h4("Travaux relevés");
    const cols=[M,M+96,M+116,M+136], wid=[94,18,18,W-M-(M+136)];
    doc.setFillColor(242,246,252); doc.rect(M,y-4,W-2*M,7,"F");
    doc.setFontSize(7.5); doc.setTextColor(...navy); doc.setFont("helvetica","bold");
    ["DÉSIGNATION","QTÉ","UNITÉ","OBSERVATION"].forEach((t,i)=>doc.text(t,cols[i]+1,y));
    y+=6;
    r.travaux.forEach(t=>{
      const l1=doc.splitTextToSize(t.designation||"—",wid[0]-2);
      const l2=t.description?doc.splitTextToSize(t.description,wid[0]-2):[];
      const l4=doc.splitTextToSize(t.obs||"",wid[3]-2);
      const hh=Math.max(l1.length+l2.length,l4.length,1)*4.4+3;
      br(hh+4);
      doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(0,23,77);
      let yy=y; l1.forEach(l=>{doc.text(l,cols[0]+1,yy);yy+=4.4;});
      doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...grey);
      l2.forEach(l=>{doc.text(l,cols[0]+1,yy);yy+=4.2;});
      doc.setFontSize(9); doc.setTextColor(30,41,59);
      doc.text(String(t.qte||""),cols[1]+1,y); doc.text(String(t.unite||""),cols[2]+1,y);
      let y4=y; l4.forEach(l=>{doc.text(l,cols[3]+1,y4);y4+=4.4;});
      y+=hh; doc.setDrawColor(225,232,240); doc.line(M,y-2,W-M,y-2);
    });
    y+=3;
  }
  if((r.photos||[]).length){
    h4("Photos du chantier");
    const cw=(W-2*M-6)/2;
    for(let i=0;i<r.photos.length;i+=2){
      const pair=r.photos.slice(i,i+2);
      const heights=pair.map(p=>{ const d=imgSize(p.src); return Math.min(cw*d.h/d.w, 60); });
      const legends=pair.map(p=>{
        const t=[(p.legende||"Sans légende")]; if(p.note) t.push(p.note);
        if(p.cat) t.push(p.cat+(p.emplacement?" · "+p.emplacement:""));
        return doc.splitTextToSize(t.join(" — "),cw);
      });
      const blockH=Math.max(...heights)+Math.max(...legends.map(l=>l.length))*3.6+8;
      br(blockH);
      pair.forEach((p,j)=>{
        const x=M+j*(cw+6);
        try{ doc.addImage(p.src,"JPEG",x,y,cw,heights[j]); }catch(err){}
        doc.setDrawColor(220,227,238); doc.rect(x,y,cw,heights[j]);
        doc.setFontSize(7.5); doc.setTextColor(...navy); doc.setFont("helvetica","bold");
        doc.text(String(i+j+1)+".",x,y+heights[j]+4);
        doc.setFont("helvetica","normal"); doc.setTextColor(70,85,110);
        let yy=y+heights[j]+4;
        legends[j].forEach((l,k)=>{ doc.text(l,x+(k===0?4:0),yy); yy+=3.6; });
      });
      y+=blockH;
    }
  }
  if(r.croquis){
    h4("Croquis");
    const d=imgSize(r.croquis), cw=W-2*M, ch=Math.min(cw*d.h/d.w,120);
    br(ch+4); try{ doc.addImage(r.croquis,"JPEG",M,y,cw,ch); }catch(err){}
    doc.setDrawColor(220,227,238); doc.rect(M,y,cw,ch); y+=ch+4;
  }
  // pieds de page
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){
    doc.setPage(i);
    doc.setFillColor(...navy); doc.rect(M,H-16,(W-2*M)*.46,1,"F");
    doc.setFillColor(...red); doc.rect(M+(W-2*M)*.6,H-16,(W-2*M)*.4,1,"F");
    doc.setFontSize(7); doc.setTextColor(...grey); doc.setFont("helvetica","normal");
    const pied=[e.nom,[e.adresse,e.cp,e.ville].filter(Boolean).join(" "),e.tel,e.email].filter(Boolean).join(" · ");
    doc.text(pied.slice(0,110),M,H-11);
    if(e.mentions) doc.text(doc.splitTextToSize(e.mentions,W-2*M-20)[0]||"",M,H-7.5);
    doc.text(i+"/"+n,W-M,H-11,{align:"right"});
  }
  return doc;
}
async function genPDF(){
  if(!can("exporter")) return toast("Votre profil ne permet pas l'export");
  toast("Génération du PDF…");
  try{
    const doc=await buildPDF(S.current);
    doc.save(nomFichier(S.current));
    await log("a exporté le rapport "+S.current.ref);
  }catch(err){ console.error(err); toast("PDF indisponible hors connexion — utilisez Imprimer"); }
}
async function partager(){
  try{
    const doc=await buildPDF(S.current);
    const blob=doc.output("blob");
    const file=new File([blob],nomFichier(S.current),{type:"application/pdf"});
    if(navigator.canShare&&navigator.canShare({files:[file]})) await navigator.share({files:[file],title:S.current.ref});
    else if(navigator.share) await navigator.share({title:S.current.ref,text:"Relevé de chantier "+S.current.ref});
    else { doc.save(nomFichier(S.current)); toast("Partage non disponible — PDF téléchargé"); }
  }catch(err){ toast("Partage annulé"); }
}

Veuillez trouver le relevé de chantier ${r.ref} réalisé le ${fdate(r.date)} par ${r.auteur}.

Objet : ${objetLabel(r)||"—"}

Cordialement,

function envoyerMail(){
  const to=$("#m_to").value, cc=$("#m_cc").value, sub=$("#m_sub").value, b=$("#m_body").value;

  log("a envoyé par email le relevé "+S.current.ref); closeSheet();
}

/* ===================== HORS CONNEXION / PWA ===================== */
function netUI(){
  const bar=$("#netbar");
  if(!navigator.onLine){ bar.style.display="block"; bar.classList.remove("sync");
    bar.textContent="Hors connexion — données enregistrées localement"; }
  else{
    const enAttente=S.releves.filter(r=>r.sync===false).length;
    bar.classList.add("sync"); bar.style.display="block";
    bar.textContent= enAttente? "Synchronisation de "+enAttente+" relevé(s)…" : "Synchronisation terminée";
    if(enAttente){ S.releves.filter(r=>!r.sync).forEach(async r=>{ r.sync=true; await DB.put("releves",r); }); }
    if(Cloud.actif()) Cloud.pull().then(()=>refresh());
    setTimeout(()=>{ if(navigator.onLine) bar.style.display="none"; },2600);
  }
  const st=$("#netState"); if(st) st.textContent=navigator.onLine?"en ligne":"hors connexion";
}
window.addEventListener("online",netUI); window.addEventListener("offline",netUI);
if("serviceWorker" in navigator && location.protocol.startsWith("http"))
  navigator.serviceWorker.register("sw.js").catch(()=>{});
window.addEventListener("beforeunload",()=>{ if(S.current&&saveTimer){ clearTimeout(saveTimer); DB.put("releves",S.current); } });
boot().then(()=>{ if(!navigator.onLine) netUI(); })
  .catch(err=>{ console.error(err); $("#login").style.display="flex"; toast("Démarrage en mode restreint"); });
</script>
